name: Release Packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Verify and name APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Calculator-Android-v0.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-Android-v0.2.0
          path: dist/*.apk
          if-no-files-found: error

  ios-release:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign
      - name: Package UNSIGNED IPA
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/Runner.app
          (cd dist && zip -qry Calculator-iOS-v0.2.0-UNSIGNED-no-codesign.ipa Payload)
          test -s dist/Calculator-iOS-v0.2.0-UNSIGNED-no-codesign.ipa
          rm -rf dist/Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-iOS-v0.2.0-UNSIGNED-no-codesign
          path: dist/*.ipa
          if-no-files-found: error

  publish-release:
    needs: [android-release, ios-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify both packages and build provenance
        run: |
          test -s release-assets/Calculator-Android-v0.2.0.apk
          test -s release-assets/Calculator-iOS-v0.2.0-UNSIGNED-no-codesign.ipa
          cd release-assets
          sha256sum *.apk *.ipa > SHA256SUMS.txt
          printf 'commit=%s\nref=%s\nversion=0.2.0+2\nandroid_signing=repository-default release signing; production signing NOT asserted\nios_signing=UNSIGNED/no-codesign; requires external signing and provisioning for installation\n' "$GITHUB_SHA" "$GITHUB_REF" > BUILD_PROVENANCE.txt
      - name: Publish complete GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: ${{ github.sha }}
          name: Calculator Vault v0.2.0
          files: |
            release-assets/Calculator-Android-v0.2.0.apk
            release-assets/Calculator-iOS-v0.2.0-UNSIGNED-no-codesign.ipa
            release-assets/SHA256SUMS.txt
            release-assets/BUILD_PROVENANCE.txt
          body: |
            Calculator Vault v0.2.0 build 2, built from the exact main commit recorded in BUILD_PROVENANCE.txt.

            Android APK: repository-default release signing state; production signing is NOT asserted.
            iOS IPA: UNSIGNED/no-codesign. It requires valid external signing and provisioning before installation.
